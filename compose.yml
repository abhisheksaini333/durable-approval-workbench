services:
  postgres:
    image: postgres:13.5-alpine@sha256:8048dd080d627956cc6d9f49eae706b1e71efadcca33f7b16f7a2357d9ff96ef
    container_name: switchboard-2022-postgres
    environment:
      POSTGRES_USER: switchboard
      POSTGRES_DB: switchboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}
    ports: ["127.0.0.1:4902:5432"]
    volumes: ["switchboard-db:/var/lib/postgresql/data"]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard -d switchboard"]
      interval: 5s
      timeout: 3s
      retries: 30
  temporal:
    image: temporalio/auto-setup:1.17.1@sha256:29e7e6fdd0f7f38965498fc856419fbc80f7902fde003b08c60ea6a1b7e4b9b4
    platform: linux/amd64
    container_name: switchboard-2022-temporal
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: switchboard
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
    ports: ["127.0.0.1:4904:7233"]
    mem_limit: 1g
    cpus: 1.0
  identity-data:
    image: postgres:13.5-alpine@sha256:8048dd080d627956cc6d9f49eae706b1e71efadcca33f7b16f7a2357d9ff96ef
    user: "0:0"
    entrypoint: ["sh", "-ec"]
    command: ["mkdir -p /identity/import /identity/h2; cp /realm-input.json /identity/import/switchboard-realm.json; chown -R 1000:0 /identity; chmod 700 /identity /identity/import /identity/h2; chmod 600 /identity/import/switchboard-realm.json"]
    volumes:
      - ./.local/switchboard-realm.json:/realm-input.json:ro
      - identity-db:/identity
    mem_limit: 32m
    cpus: 0.25
  keycloak:
    image: quay.io/keycloak/keycloak:18.0.2@sha256:b4841a7b8401fd209bfcddf10773cdfa7c7cfde4bf7e87780663226be5587ee2
    platform: linux/amd64
    container_name: switchboard-2022-keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      identity-data: {condition: service_completed_successfully}
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_APPEND: "-Xms64m -Xmx256m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:TieredStopAtLevel=1 -XX:ActiveProcessorCount=2"
      KC_HOSTNAME_STRICT: "false"
    ports: ["127.0.0.1:4901:8080"]
    volumes:
      - identity-db:/opt/keycloak/data
    mem_limit: 768m
    cpus: 1.0
volumes:
  switchboard-db:
    name: switchboard-2022-pg
  identity-db:
    name: switchboard-2022-identity
