name: Validate Switchboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:13.5-alpine@sha256:8048dd080d627956cc6d9f49eae706b1e71efadcca33f7b16f7a2357d9ff96ef
        env:
          POSTGRES_USER: switchboard
          POSTGRES_PASSWORD: local-ci-database-password
          POSTGRES_DB: switchboard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U switchboard -d switchboard"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://switchboard:local-ci-database-password@127.0.0.1:5432/switchboard
    steps:
      - uses: actions/checkout@2541b1294d2704b0964813337f33b291d3f8596b # v3.0.2
      - uses: actions/setup-node@2fddd8803e2f5c9604345a0b591c3020ee971a93 # v3.4.1
        with:
          node-version: 16.16.0
      - run: npm ci --no-audit --no-fund
      - run: python3 scripts/install-test-server.py
      - run: npm run build
      - run: npm test
      - name: Database and workflow integration
        shell: bash
        run: npm run test:integration 2>&1 | tee integration.log
